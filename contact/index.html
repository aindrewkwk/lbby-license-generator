<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — R Studio</title>
  <meta name="description" content="Get in touch with R Studio. Questions, feedback, or support — reach out to us.">
  <link rel="icon" href="/assets/r-studio-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <a href="/" class="nav-brand">
      <img src="/assets/r-studio-icon.svg" alt="R Studio">
      <span>R Studio</span>
    </a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">☰</button>
    <div class="nav-links">
      <a href="/" data-i18n="nav.products">Sản phẩm</a>
      <a href="/lbby" data-i18n="nav.lbby">Lbby</a>
      <a href="/docs" data-i18n="nav.docs">Tài liệu</a>
      <a href="/changelog" data-i18n="nav.changelog">Nhật ký</a>
      <a href="/license" data-i18n="nav.license">Giấy phép</a>
      <a href="/contact" data-i18n="nav.contact">Liên hệ</a>
      <button class="lang-toggle" onclick="toggleLang()" title="Switch language">
        <span data-i18n="nav.lang_label">EN</span>
      </button>
    </div>
  </nav>

  <!-- Page Hero -->
  <section class="page-hero">
    <div class="page-hero-content">
      <h1 data-i18n="contact.title">Liên hệ</h1>
      <p data-i18n="contact.subtitle">Có câu hỏi, phản hồi hay cần hỗ trợ? Hãy liên hệ với chúng tôi.</p>
    </div>
  </section>

  <!-- Contact -->
  <section class="section">
    <div class="contact-links">
      <a href="https://discord.gg/WgyYK623" target="_blank" class="contact-card">
        <span class="icon">💬</span>
        <div>
          <div class="label" data-i18n="contact.discord">Discord</div>
          <div class="sub" data-i18n="contact.discord_sub">Tham gia cộng đồng</div>
        </div>
      </a>
      <a href="https://github.com/aindrewkwk/lbby-app" target="_blank" class="contact-card">
        <span class="icon">📦</span>
        <div>
          <div class="label" data-i18n="contact.github">GitHub</div>
          <div class="sub" data-i18n="contact.github_sub">Mã nguồn &amp; vấn đề</div>
        </div>
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p data-i18n="footer.copyright">&copy; 2026 R Studio. Mọi quyền được bảo lưu.</p>
  </footer>

  <!-- Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
